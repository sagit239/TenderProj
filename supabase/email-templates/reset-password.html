<!-- Supabase Auth → Email Templates → Reset Password. Subject: איפוס סיסמה · ניהול מכרזים
     The link goes through /auth/confirm (ADR-21). Set the same template in Production (M8). -->
<div dir="rtl" lang="he" style="font-family:Heebo,Arial,sans-serif;color:#1E1E21;text-align:right;direction:rtl;max-width:520px">
  <h2 style="margin:0 0 16px;font-size:20px">איפוס סיסמה · ניהול מכרזים</h2>
  <p style="margin:0 0 16px">התקבלה בקשה לאיפוס הסיסמה למערכת ניהול המכרזים.</p>
  <p style="margin:0 0 24px">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
       style="display:inline-block;background:#A3140F;color:#FFFFFF;text-decoration:none;font-weight:600;padding:10px 20px;border-radius:6px">
      בחירת סיסמה חדשה
    </a>
  </p>
  <p style="margin:0;color:#6E6E73;font-size:13px">הקישור תקף לזמן מוגבל ולשימוש אחד. אם לא ביקשת לאפס את הסיסמה, אפשר להתעלם מהמייל הזה.</p>
</div>
